<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Abstract warm portrait">
  <!--
    Mock portrait 01 — soft warm bloom.
    Warm rose / peach / coral atmosphere with a soft central
    light. Deliberately abstract: no face, no silhouette that
    reads as any particular identity.
  -->
  <defs>
    <radialGradient id="p01-bg" cx="50%" cy="55%" r="72%">
      <stop offset="0%"  stop-color="#F3D0BA"/>
      <stop offset="55%" stop-color="#E19A7F"/>
      <stop offset="100%" stop-color="#A8564A"/>
    </radialGradient>
    <radialGradient id="p01-bloom" cx="50%" cy="40%" r="42%">
      <stop offset="0%"  stop-color="rgba(255,244,232,0.70)"/>
      <stop offset="70%" stop-color="rgba(255,244,232,0)"/>
    </radialGradient>
    <radialGradient id="p01-warm" cx="70%" cy="78%" r="38%">
      <stop offset="0%"  stop-color="rgba(255,180,138,0.55)"/>
      <stop offset="80%" stop-color="rgba(255,180,138,0)"/>
    </radialGradient>
    <filter id="p01-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="240" height="240" fill="url(#p01-bg)"/>
  <ellipse cx="120" cy="96" rx="90" ry="70" fill="url(#p01-bloom)" filter="url(#p01-soft)"/>
  <ellipse cx="170" cy="188" rx="70" ry="55" fill="url(#p01-warm)" filter="url(#p01-soft)"/>
</svg>
