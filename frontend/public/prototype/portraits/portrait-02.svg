<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Abstract cool portrait">
  <!--
    Mock portrait 02 — soft sage / teal.
    Cooler atmosphere with a horizontal light band suggesting
    dawn over water. Deliberately abstract.
  -->
  <defs>
    <radialGradient id="p02-bg" cx="55%" cy="58%" r="75%">
      <stop offset="0%"  stop-color="#B8D4C4"/>
      <stop offset="55%" stop-color="#6E9D8B"/>
      <stop offset="100%" stop-color="#2E4B48"/>
    </radialGradient>
    <radialGradient id="p02-light" cx="70%" cy="30%" r="36%">
      <stop offset="0%"  stop-color="rgba(232,245,238,0.72)"/>
      <stop offset="70%" stop-color="rgba(232,245,238,0)"/>
    </radialGradient>
    <linearGradient id="p02-band" x1="0%" y1="55%" x2="100%" y2="55%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0)"/>
      <stop offset="45%"  stop-color="rgba(255,255,255,0.24)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="p02-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="240" height="240" fill="url(#p02-bg)"/>
  <rect x="0" y="118" width="240" height="20" fill="url(#p02-band)" filter="url(#p02-soft)"/>
  <ellipse cx="170" cy="72" rx="65" ry="52" fill="url(#p02-light)" filter="url(#p02-soft)"/>
</svg>
