[pytest]
# Fresh Collective test suite — scoped to the standalone Gathering
# ticket feature (Stage 2 of the paid-Gathering rollout).
#
# Tests run against a real PostgreSQL database (fc_test) so row
# locking, PostgreSQL intervals, CHECK constraints, ADD VALUE enums,
# and concurrent transaction behaviour are all faithfully exercised —
# SQLite cannot represent any of that reliably.
#
# Environment expected:
#   TEST_DATABASE_URL — full PostgreSQL URL to the local fc_test database.
# If unset, the conftest.py fixture derives it from DATABASE_URL by
# swapping the database name to `fc_test`. Never place credentials in
# this file, in test source, or in shell command examples.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --tb=short
markers =
    concurrency: tests that exercise concurrent DB transactions
    slow: tests that intentionally take longer (e.g. sleep for expiry)
