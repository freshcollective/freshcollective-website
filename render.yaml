  # ── Complimentary Creator grant expiry ─────────────────────────────
  # Closes the finite complimentary Creator lifecycle: notifies during
  # the 14-day renewal window and the 7-day grace period, then returns
  # a creator to the implicit Community plan if they did not elect to
  # continue.
  #
  # Daily rather than every 15 minutes, deliberately: these are
  # day-level commercial terms, so a grant that becomes due at 02:00
  # does not need sub-hourly precision, and a lower frequency means
  # fewer opportunities for an entitlement-changing job to run while
  # something else is wrong.
  #
  # Idempotent on every axis, so a missed run self-heals on the next
  # and a double run changes nothing: expiry only matches grants still
  # holding the active slot (a cancelled one no longer matches), and
  # notifications dedupe against the grant's own dates rather than the
  # run time.
  #
  # ``--apply`` is required for the job to write anything at all; the
  # script's default is a read-only dry run that also prints the
  # pre-arming survey. Dropping the flag turns this cron into a
  # reporter, which is the safe failure direction.
  #
  # Protected by canonical plan slug, not by wording or by a null end
  # date: founding-creator and organisation can never be expired here.
  # That is load-bearing — the 2026-10-04 production survey showed
  # Lindsey's Founding Creator grant carries ``reason='comp'``, so the
  # grant_reason filter alone would not have saved it.
  #
  # Least-privilege env — strictly less than fc-api:
  #
  #   * FC_SERVICE_ROLE=job          — skips the web-role JWT_SECRET
  #                                    and R2 requirements.
  #   * FC_JOB_REQUIRES_STRIPE=false — no Stripe key or webhook secret.
  #                                    This job never calls Stripe; it
  #                                    only reads local subscription
  #                                    rows. A paid subscriber is
  #                                    excluded by a DB query, not by
  #                                    asking Stripe.
  #   * DATABASE_URL                 — same DB as fc-api.
  #   * APP_ENV=production           — correct environment in logs.
  #
  # Deliberately NOT granted: RESEND_API_KEY / EMAIL_FROM. The
  # lifecycle notifications are in-app ``notifications`` rows with a
  # relative URL, so this job dispatches no email and needs no mail
  # credentials or FRONTEND_ORIGIN. If email is added later, grant them
  # then — see the Gathering reminders block for why that pair is
  # genuinely privileged.
  - type: cron
    name: fc-creator-grant-expiry
    runtime: python
    region: singapore
    branch: main
    rootDir: backend
    schedule: "0 2 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/creator_grant_expiry_reconcile.py --apply
    envVars:
      - key: FC_SERVICE_ROLE
        value: "job"
      - key: FC_JOB_REQUIRES_STRIPE
        value: "false"
      - key: APP_ENV
        value: production
      # Canonical public address for every member-facing link. Required
      # on each APP_ENV=production service — ``_check_public_app_url``
      # refuses to boot without it. See the fc-api block for why this is
      # not FRONTEND_ORIGIN.
      - key: PUBLIC_APP_URL
        value: https://freshcollective.au
      - key: DATABASE_URL
        fromDatabase:
          name: fc-db
          property: connectionString
      # Error reporting — the same Sentry project and the same DSN
      # value as fc-api. The ``component`` tag, set by the script from
      # its own Render service name, is what separates this job's
      # issues from the API's. Dashboard-owned; absent is a clean
      # no-op. See the fc-api block for the full reasoning.
      - key: SENTRY_DSN
        sync: false

  # ── Gathering reminders ────────────────────────────────────────────
  # Sends the single 24-hour reminder for every confirmed booking whose
  # reminder point has come due. Every 15 minutes; the sweep's own
  # 35-minute backward window means one missed run self-heals on the
  # next, and the dedupe key
  # ``gathering_reminder_24h:{booking_id}`` makes overlapping runs
  # incapable of double-sending.
  #
  # Least-privilege env — this job needs strictly less than fc-api:
  #
  #   * FC_SERVICE_ROLE=job         — skips the web-role JWT_SECRET and
  #                                    R2 requirements. The job never
  #                                    signs a token or touches uploads.
  #   * FC_JOB_REQUIRES_STRIPE=false — no Stripe key or webhook secret.
  #                                    The sweep reads bookings and
  #                                    emits comms events; it never
  #                                    calls Stripe.
  #   * DATABASE_URL                — same DB as fc-api.
  #   * APP_ENV=production          — correct environment in logs.
  #   * FRONTEND_ORIGIN             — builds the gathering CTA link and
  #                                    the footer preferences link. An
  #                                    unset value would silently send
  #                                    localhost URLs to members.
  #   * RESEND_API_KEY / EMAIL_FROM — REQUIRED, and the one genuinely
  #                                    privileged pair here. This job
  #                                    dispatches inline: emit →
  #                                    schedule_routing_if_needed(None,…)
  #                                    routes AND delivers in-process
  #                                    (see comms/rollout.py), because
  #                                    no queue drain worker exists.
  #                                    Without them the reminder intent
  #                                    is created and immediately fails
  #                                    with ``config_missing``.
  #
  # Deliberately NOT granted: JWT_SECRET, STRIPE_*, R2_*,
  # RESEND_WEBHOOK_SECRET, INTERNAL_COMMS_SECRET.
  - type: cron
    name: fc-gathering-reminders
    runtime: python
    region: singapore
    branch: main
    rootDir: backend
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
