# render.yaml — Fresh Collective four-resource Blueprint.
#
# Scope
# -----
# Declares the full production topology on Render:
#   1. fc-web  — Next.js frontend (public web service)
#   2. fc-api  — FastAPI backend (public web service)
#   3. fc-fip3-grace-reconciler — FIP3 grace-expiry cron
#   4. fc-db   — managed Postgres
#
# All regional resources are pinned to Singapore. The runtime keys use
# the current `runtime:` field (Render deprecated `env:` in favour of
# `runtime:` — see https://render.com/docs/blueprint-spec).
#
# Why the cron exists alongside the in-process reconciler
# -------------------------------------------------------
# ``backend/app/services/finite_plan_reconciler.py`` runs a
# 5-minute in-process sweep from FastAPI's lifespan. That's belt.
# This cron is braces: an independent scheduler that keeps grace-expiry
# transitions honest when the web dyno restarts, deploys, or sleeps.
# Both triggers are idempotent (row-locked + status re-check under
# lock in ``sweep_expired_grace_plans``); running the same expired
# plan twice is safe.
#
# See docs/finite-payment-plans-stripe-config.md for the operator
# requirements this Blueprint satisfies.
#
# Uploads storage — Cloudflare R2
# -------------------------------
# fc-api writes uploads to Cloudflare R2 when the R2_* env vars are
# set (see the fc-api block below). Two buckets: private for member/
# creator content served via short-lived presigned URLs, public for
# platform artwork on marketing pages. When R2 credentials are absent
# the storage module falls back to ``backend/uploads/`` on the local
# filesystem — used only by local dev and tests, since that path is
# EPHEMERAL on Render (wiped on every deploy / restart / instance
# move). Any production deploy MUST have the R2 env vars set.
#
# Migration policy
# ----------------
# fc-api declares ``preDeployCommand: alembic upgrade head`` (see the
# fc-api service block below). Render runs it against the newly-built
# release image BEFORE cutting any traffic over, so the schema is
# always in place before code that requires it starts serving.
#
# What this policy covers:
#   * Normal, additive, backwards-compatible migrations (add nullable
#     column; add table; add index CONCURRENTLY; add enum value;
#     backfill that completes in seconds). These run automatically
#     on every deploy — no operator action required.
#
# What this policy does NOT cover — must ship as an explicit,
# staged multi-deploy plan documented in the migration file itself:
#   * Dropping or renaming a column, table, enum value, or constraint.
#   * NOT NULL / CHECK additions that require a data backfill first.
#   * Any migration whose upgrade() step is not safe to run against
#     the currently-live application code (e.g. removing a column the
#     old code still SELECTs).
#   * Long-running data migrations that hold locks or block writes
#     beyond a few seconds.
#   * Anything that cannot be rolled back cleanly without data loss.
#
# ``alembic upgrade head`` alone does NOT make an unsafe migration
# safe — the author of the migration is responsible for staging the
# rollout (e.g. add-column-nullable → deploy → backfill → deploy →
# add-NOT-NULL). If in doubt, the migration should note the staging
# plan at the top and reviewers should confirm the plan before merge.

databases:
  # ─────────────────────────────────────────────────────────────────
  # Managed Postgres — fc-db
  # ─────────────────────────────────────────────────────────────────
  # Plan slug uses Render's current compute-notation format
  # (Nc-Ng); ``0.5c-1g`` is the canonical Blueprint ID for the
  # 0.5 CPU / 1 GB Postgres tier (equivalent to the legacy alias
  # ``basic-1gb``) — smallest paid plan, ~100 max connections.
  # Adequate for smoke + early access; resize via Render Dashboard
  # when needed.
  # ipAllowList: [] means "no public IPs allowed" — Postgres is
  # only reachable from services inside the same Render region via
  # the internal connection string.
  #
  # Migrations
  # ----------
  # Applied automatically by fc-api's ``preDeployCommand`` on every
  # release (see the top-of-file "Migration policy" block for the
  # additive-only scope and the staged-rollout requirement for
  # destructive changes).
  # Backend boots on empty DB: /health has no DB dependency;
  # lifespan background tasks (reconciler + publisher) use
  # asyncio.create_task so exceptions log non-fatally; alembic is
  # installed via requirements.txt (``alembic>=1.14.0``).
  # fc-db remains externally closed (ipAllowList: []); no
  # operator-IP allowlisting required.
  - name: fc-db
    plan: 0.5c-1g
    region: singapore
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  # ─────────────────────────────────────────────────────────────────
  # Frontend web service — fc-web (Next.js)
  # ─────────────────────────────────────────────────────────────────
  # Next.js production build; ``npm start`` serves the built app on
  # Render's injected $PORT. Node pin is via the NODE_VERSION env
  # var (Render's Blueprint-native mechanism — no .nvmrc needed).
  #
  # Backend URL wiring (SEC-002, SEC-010 Step 1)
  # --------------------------------------------
  # ``API_INTERNAL_URL`` is the server-side target for the Next.js proxy
  # handler at ``src/app/api/[...path]/route.ts`` and for the server
  # helpers in ``src/lib/serverApi.ts``. It is NEVER exposed to the
  # browser: application API calls originate same-origin against
  # ``fc-web`` and are forwarded server-side to this URL.
  #
  # SEC-010 Step 1 — pulled via ``fromService.property: hostport``, which
  # returns fc-api's Render *private* ``<hostname>:<port>`` reachable
  # only from services in this same Render account/region. Traffic
  # therefore never traverses Cloudflare or the public load balancer,
  # so the browser IP loss observed at the public hop (SEC-010
  # investigation) is architecturally avoided. ``resolveInternalApiBase``
  # in ``frontend/src/lib/api.ts`` prepends ``http://`` when the value
  # is a bare host:port (Render private) and leaves full URLs alone
  # (local dev). No scheme change required to the env var itself.
  #
  # ``NEXT_PUBLIC_API_URL`` is separately baked into the client bundle
  # for media URLs only (``<img src>`` against ``/api/uploads/…``). It
  # still points at the *public* HTTPS host because browsers cannot
  # reach the private one. Keeping the two variables distinct preserves
  # the least-privilege split between "browser knows the media host"
  # and "server knows the API host".
  #
  # NOTE: no ``AUTH_SECRET`` is declared here. fc-web deliberately does
  # not receive the JWT signing key — the backend is the sole
  # authority for session verification via ``/api/auth/me``.
  - type: web
    name: fc-web
    runtime: node
    region: singapore
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.15.0"
      # Discover Places. Build-time inlined by Next.js, so flipping it
      # requires a rebuild of fc-web, not just a restart. The backend
      # sibling DISCOVERY_PILLAR_ENABLED on fc-api must be turned on
      # first, or the page renders and every /api/places call 503s.
      - key: NEXT_PUBLIC_DISCOVERY_PILLAR_ENABLED
        value: "true"
      # Ways to Connect — launched globally. Gated separately from
      # Discover Places, same build-time semantics: NEXT_PUBLIC_* is
      # inlined by Next, so this takes effect on a rebuild and never on
      # a restart. Its backend sibling WAYS_TO_CONNECT_ENABLED on
      # fc-api has to be on too, or the nav and the page appear and the
      # GET /api/ways-to-connect behind them 503s.
      #
      # Declared here rather than left to the Dashboard, for the same
      # reason Discovery is: a ``value:`` entry is reasserted on every
      # blueprint sync, so a Dashboard-only "true" can be reverted to
      # whatever this file says. That reverts *asymmetrically*, which
      # is what makes it hard to recognise — Platform Owner keeps
      # working through the preview bypass in
      # ``ways_to_connect_available`` while every ordinary member loses
      # the feature, so it reads like a permissions bug rather than a
      # flag one.
      - key: NEXT_PUBLIC_WAYS_TO_CONNECT_ENABLED
        value: "true"
      # Server-side proxy target — not exposed to the browser.
      # SEC-010 Step 1: routes BFF traffic over Render's private
      # per-account network. ``hostport`` yields ``<host>:<port>``;
      # ``resolveInternalApiBase`` in the frontend prepends ``http://``.
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: fc-api
          property: hostport
      # Media / <img src> only — public host baked into the client bundle.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: fc-api
          envVarKey: RENDER_EXTERNAL_URL
      # SEC-010 Step 2 — shared credential authenticating the BFF's
      # ``X-Fc-Client-IP`` claim to fc-api. Must be the SAME value on
      # both fc-web and fc-api. ``sync: false`` = Render prompts on
      # first sync and never commits the value back to git. Enter via
      # each service's Environment page. Rotation = paste new value on
      # both services; a ~90-second restart window briefly degrades
      # limiter accuracy but no security regression.
      - key: INTERNAL_BFF_SECRET
        sync: false
      # Error reporting (Sentry project fc-web). ONE variable for both
      # runtimes, deliberately.
      #
      # A DSN is a public submission endpoint and has to reach the
      # browser to be any use there, so a second server-only
      # ``SENTRY_DSN`` holding the identical value would buy no secrecy
      # and would add the one thing worth avoiding: two places to
      # rotate, and silence if they disagree. Next inlines
      # ``NEXT_PUBLIC_*`` into the client bundle at build time and
      # Render also hands it to the running server, so this covers the
      # browser, server components, route handlers and the BFF proxy.
      #
      # Build-time inlined, like the feature flags above: changing the
      # DSN takes effect on a rebuild, never on a restart. The enforcing
      # CSP's ``connect-src`` entry is derived from this same value at
      # build time (see ``src/lib/securityHeaders.ts``), which is the
      # other reason a restart is not enough — and the reason a wrong
      # value fails closed rather than quietly sending nowhere.
      #
      # Absent or empty is a clean no-op: ``init`` is never called, the
      # app boots, and the CSP is byte-for-byte its pre-Sentry value.
      # That is how every local run and every CI build behaves.
      #
      # No SENTRY_ENVIRONMENT — derived from NODE_ENV. No SENTRY_RELEASE
      # — ``next.config.ts`` maps Render's own RENDER_GIT_COMMIT into
      # the client bundle and the server reads it directly. No
      # SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT: source-map
      # upload is Phase 4, and this integration needs no build wrapper.
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      # ── Private source maps (Phase 4B) ───────────────────────────────
      # Build-time only. Both are read by Sentry's bundler plugin during
      # ``npm run build``; nothing at runtime touches either, so the
      # running service would behave identically with both absent.
      #
      # What they buy: a production browser stack frame that reads
      # ``src/app/creator-studio/offers/page.tsx:38`` instead of
      # ``09ae.el~njpln.js:1:48213``.
      #
      # The maps never become public. Turbopack generates them during
      # the build, the plugin uploads them, then deletes every ``*.map``
      # under ``.next/static`` and strips the ``sourceMappingURL``
      # comments that pointed at them — all inside ``next build``, so
      # the image this service starts has no client maps in it. Verified
      # against a served build: a chunk returns 200 and its ``.map``
      # returns 404.
      #
      # SENTRY_AUTH_TOKEN is the only secret in the Sentry work. It is
      # an Organization Auth Token scoped to project:releases — enough
      # to create a release and upload artifacts, and nothing else. A
      # missing or revoked token does not fail the build: the plugin
      # logs that it uploaded nothing and the deploy proceeds, so
      # rotating it degrades symbolication and never availability.
      #
      # SENTRY_ORG is the organisation slug. Not a secret, but not
      # knowable from this repository either — the DSN carries the
      # numeric org id, not the slug — so it is operator-supplied.
      #
      # No SENTRY_PROJECT: ``fc-web`` is a literal in
      # ``src/lib/sentryBuildOptions.ts``, where it cannot be set to the
      # wrong project by a typo in a dashboard field.
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false

  # ─────────────────────────────────────────────────────────────────
  # Backend web service — fc-api (FastAPI)
  # ─────────────────────────────────────────────────────────────────
  # Backend uses pip + requirements.txt (no pyproject.toml, no uv,
  # no Poetry). Render's default Python buildpack runs pip install
  # against requirements.txt at buildCommand and puts uvicorn on
  # $PATH, so no ``.venv/bin/*`` prefix is used or needed.
  #
  # rootDir: backend so every command is backend-relative and doesn't
  # trip over the legacy Next.js scaffold that still lives at repo
  # root (the active frontend is at frontend/, not /).
  - type: web
    name: fc-api
    runtime: python
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Alembic runs against the freshly-built release image before
    # Render cuts any traffic over, so the schema is always in place
    # before the new code starts serving. On non-zero exit the deploy
    # aborts and existing traffic continues to hit the previous
    # image. See the top-of-file "Migration policy" block for the
    # additive-only scope and the staged-rollout requirement for
    # destructive changes.
    preDeployCommand: alembic upgrade head
    # Render injects $PORT; bind 0.0.0.0 for public traffic.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Committed, safe defaults ------------------------------------
      - key: APP_ENV
        value: production
      # The canonical public address of the app, and the ONLY source
      # for links a member sees — emails, Stripe return URLs, anything
      # clickable. Pinned with ``value:`` rather than ``sync: false``
      # on purpose: this is a stable fact about the product, not an
      # operator toggle, and a blueprint sync reasserting it is the
      # behaviour we want here.
      #
      # Deliberately NOT ``FRONTEND_ORIGIN``. That is the CORS origin
      # and is wired to fc-web's ``RENDER_EXTERNAL_URL``, so its value
      # is the platform host by construction. Leaving this undeclared
      # let the fallback in ``resolved_public_app_url`` resolve every
      # member-facing link to ``fc-web-….onrender.com`` — which is how
      # a password-reset email shipped a Render URL.
      #
      # ``Settings._check_public_app_url`` now refuses to boot a
      # production service whose link origin is a platform or localhost
      # host, so this must stay set on every APP_ENV=production service.
      - key: PUBLIC_APP_URL
        value: https://freshcollective.au
      # Public member finite-plan checkout — Dashboard-managed kill
      # switch. Declared here with ``sync: false`` so Render prompts on
      # first Blueprint sync but NEVER overwrites the production
      # Dashboard value on subsequent deploys (a previous
      # ``value: "false"`` declaration silently reset production every
      # time the Blueprint was re-applied). Application default when
      # the env var is absent is ``False`` — see
      # ``finite_plan_member_checkout_enabled: bool = False`` in
      # ``backend/app/core/config.py``. Flip to "true" only via the
      # Render Dashboard, and only after the hosted smoke sequence in
      # ``docs/finite-payment-plans-stripe-config.md`` §6 passes.
      - key: FINITE_PLAN_MEMBER_CHECKOUT_ENABLED
        sync: false
      # Creator Plan guard — Dashboard-managed. When true, paid
      # checkout for a creator-owned Space with no active/trialing
      # CreatorSubscription raises HTTP 409 instead of silently
      # falling back to fee_bps=0. Kept ``sync: false`` for the same
      # reason as FINITE_PLAN_MEMBER_CHECKOUT_ENABLED — the Dashboard
      # is the operational source of truth, not this file. Flip to
      # true only AFTER Fresh Collective founders are on an explicit
      # Founding Creator subscription. Application default when the
      # env var is absent is False (see
      # ``backend/app/core/config.py:creator_plan_guard_enabled``).
      - key: CREATOR_PLAN_GUARD_ENABLED
        sync: false
      # Discover Places' read API. LIVE — and declared here on purpose:
      # this value is blueprint-managed, so a Dashboard-only change is
      # reverted by the next Blueprint sync. That is what silently took
      # the Discover Places doorway off Your World; the surface stayed
      # built and the flag simply went back to false. Keep this and its
      # fc-web sibling in step — see ``discoveryPillar.test.ts``.
      - key: DISCOVERY_PILLAR_ENABLED
        value: "true"
      # Ways to Connect's read API. LIVE — and blueprint-managed for
      # exactly the reason given above Discovery: a Dashboard-only
      # change here is reverted by the next sync, and the application
      # default is False (see
      # ``backend/app/core/config.py:ways_to_connect_enabled``), so
      # losing the declaration loses the feature.
      #
      # Must not lag its fc-web sibling. With this off and the frontend
      # on, members get the nav and the page and a 503 behind them.
      - key: WAYS_TO_CONNECT_ENABLED
        value: "true"
      - key: COMMUNITY_CARE_ENABLED
        value: "false"

      # Managed Postgres wire-up ------------------------------------
      # Uses Render's fromDatabase cross-reference so the connection
      # string is injected automatically on every deploy — no manual
      # dashboard edit, and the value rotates cleanly if the DB is
      # recreated.
      - key: DATABASE_URL
        fromDatabase:
          name: fc-db
          property: connectionString

      # Secrets / environment-specific — set in Render Dashboard ----
      # sync: false makes Render prompt on first Blueprint sync and
      # NEVER commits the value back to the file.
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      # STRIPE_WEBHOOK_SECRET
      # ---------------------
      # Set AFTER fc-api has a public HTTPS URL and a Render-hosted
      # Stripe test webhook is created pointing at
      # {fc-api-url}/api/webhooks/stripe. Do NOT reuse the local
      # Stripe CLI whsec — that secret only signs events that the
      # local CLI forwards.
      #
      # Missing value is safe at boot: settings.stripe_webhook_secret
      # defaults to None (see backend/app/core/config.py), the app
      # starts cleanly, and the /api/webhooks/stripe endpoint
      # rejects unsigned/unverifiable requests with HTTP 400 via
      # stripe.Webhook.construct_event (SignatureVerificationError).
      #
      # RESEND_WEBHOOK_SECRET intentionally omitted at launch. Add
      # after fc-api HTTPS URL exists and the Resend webhook is
      # configured at {fc-api-url}/api/webhooks/comms/resend
      # (R4 already handles missing-secret cleanly: startup warning,
      # non-fatal, endpoint rejects with 401).
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PLATFORM_OWNER_EMAIL
        sync: false
      - key: STRIPE_PRICE_ID_CREATOR
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      # SEC-010 Step 2 — must match fc-web's INTERNAL_BFF_SECRET exactly.
      # See the comment on fc-web's declaration for rotation guidance.
      - key: INTERNAL_BFF_SECRET
        sync: false
      # SEC-007 — dedicated credential for the four ``/api/internal/*``
      # endpoints (dispatch-due, reconcile-shadow, dev-test-send,
      # send-event-reminders). Independent of ``JWT_SECRET`` so
      # possession of this token cannot mint user session JWTs, and
      # independent of ``INTERNAL_BFF_SECRET`` so the two internal
      # trust domains rotate separately. Compared with
      # ``secrets.compare_digest`` via
      # ``app.core.internal_auth.verify_internal_token``. Missing
      # value = every internal endpoint fails closed with 401.
      #
      # Not declared on ``fc-web`` (no code path there consumes
      # internal endpoints) or on the ``fc-fip3-grace-reconciler``
      # cron (it makes no HTTP calls to fc-api). Add to any future
      # service that legitimately needs to call ``/api/internal/*``.
      - key: INTERNAL_COMMS_SECRET
        sync: false
      # Auto-wired from fc-web's RENDER_EXTERNAL_URL via Render's
      # Blueprint fromService.envVarKey mechanism — the full
      # public HTTPS URL is injected at deploy time, so no
      # dashboard placeholder step is needed.
      #
      # Used for CORS *only* — this is the browser origin allowed to
      # call the API, and it is the platform host by construction.
      # Member-facing links come from PUBLIC_APP_URL above. It used to
      # be the documented fallback for PUBLIC_APP_URL, and since that
      # var was never declared, every email link resolved to this
      # Render host.
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: fc-web
          envVarKey: RENDER_EXTERNAL_URL

      # Persistent Media Storage — Cloudflare R2.
      # ----------------------------------------------------------------
      # Two buckets: ``fc-media`` (private, presigned reads) and
      # ``fc-media-public`` (public via R2.dev URL for now, custom
      # domain later). Split matches the ``/api/uploads/*`` router:
      # ``platform-artwork/*`` keys go to the public bucket, everything
      # else to the private one. See ``app/core/storage.py`` +
      # ``app/uploads/routes.py``.
      #
      # Production requires all six vars — the ``_check_r2_configuration``
      # validator in ``core/config.py`` refuses to boot fc-api when
      # ``APP_ENV=production`` and any R2 var is missing. On Render
      # that aborts the deploy and the previous image keeps serving,
      # so uploads never land on the container's ephemeral disk in
      # production. A partial R2 config (some vars set, others not)
      # also refuses to boot in any environment.
      #
      # ``sync: false`` on the three credentials + the public URL
      # (which changes when Lindsey attaches a custom domain later).
      # Bucket names are safe in git and set as literal values so a
      # blueprint re-apply does not require re-entering them.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_PRIVATE
        value: fc-media
      - key: R2_BUCKET_PUBLIC
        value: fc-media-public
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # Error reporting (Sentry project fc-api). Dashboard-owned: it is
      # an ingest endpoint rather than a stable fact about the product,
      # and it is rotated independently of a deploy.
      #
      # Absent or empty is a clean no-op — ``init_sentry`` logs that
      # reporting is off and the app boots normally, which is how every
      # local run and the whole test suite behave.
      #
      # Every cron now declares the same variable, holding the same
      # value — one project, eight components. Each process tags its
      # events with its Render service name, so "which job" is a filter
      # rather than a separate project to go and look at.
      #
      # No SENTRY_ENVIRONMENT: the environment is derived from APP_ENV
      # above so the two cannot drift. No SENTRY_RELEASE: Render
      # supplies RENDER_GIT_COMMIT and the SDK reads it directly.
      - key: SENTRY_DSN
        sync: false

  # ─────────────────────────────────────────────────────────────────
  # FIP3 grace-expiry reconciler — independent cron
  # ─────────────────────────────────────────────────────────────────
  # Runs every 15 minutes. Cadence is a reliability decision, not a
  # timing one — the sweep uses ``grace_expires_at <= now`` so a
  # 3-hour-late run still catches everything correctly. The cron is
  # a safety net for the in-process reconciler, not its replacement.
  #
  # The script is standalone-safe as of the registry-priming import
  # added on 2026-08-19 (see the script's header comment).
  #
  # Does NOT need Stripe credentials — the sweep itself is DB-only.
  # But it imports app.main to load the full SQLAlchemy model
  # registry, which pulls in ``settings = Settings()`` at module
  # load; that requires DATABASE_URL to be present (no dataclass
  # default in ``app.core.config.Settings``).
  #
  # Runtime config, completed 2026-10-06 — the three go together:
  #
  #   * ``APP_ENV=production``        — this job had no APP_ENV at all,
  #                                     so it ran as "development": the
  #                                     production guards below never
  #                                     applied to it, and its error
  #                                     reports would have arrived in
  #                                     Sentry tagged as development
  #                                     while running against the
  #                                     production database.
  #   * ``FC_SERVICE_ROLE=job``       — required *because of* the line
  #                                     above. At the default ``web``
  #                                     role, APP_ENV=production demands
  #                                     the full R2 credential set,
  #                                     which this job has no use for
  #                                     and must not be given.
  #   * ``FC_JOB_REQUIRES_STRIPE=false`` — and this one because a
  #                                     production job otherwise has to
  #                                     carry STRIPE_SECRET_KEY. It
  #                                     never calls Stripe.
  #
  # Adding APP_ENV on its own would stop this cron booting. There is a
  # test that fails if anyone tries.
  #
  # JWT_SECRET is kept although ``role=job`` no longer requires it:
  # this is the one cron that imports app.main, which loads the auth
  # module, and least-privilege is not worth a surprise in a safety-net
  # job. It signs nothing.
  #
  # Deliberately NOT granted: RESEND_API_KEY / EMAIL_FROM. A suspension
  # emits ``access.suspended``, which is a live topic, so this job
  # creates the intent and the Resend provider then declines it with
  # ``config_missing`` at WARNING — the member gets no email from *this*
  # path. In practice the in-process reconciler inside fc-api does this
  # work every 5 minutes with full credentials and sends it; the cron is
  # the safety net, and only a long fc-api outage would make the
  # difference visible. Granting mail credentials to an entitlement job
  # is a bigger decision than this blueprint entry, so it is recorded
  # here rather than quietly made.
  - type: cron
    name: fc-fip3-grace-reconciler
    runtime: python
    region: singapore
    branch: main
    rootDir: backend
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/fip3_reconcile_grace.py
    envVars:
      # Canonical public address for every member-facing link. Declared on
      # EVERY python service, not only the ones that send email: each of
      # them constructs the shared ``Settings`` object, and
      # ``_check_public_app_url`` is a global production invariant on it.
      # See the fc-api block for why this is not FRONTEND_ORIGIN.
      - key: PUBLIC_APP_URL
        value: https://freshcollective.au
      - key: DATABASE_URL
        fromDatabase:
          name: fc-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: APP_ENV
        value: production
      - key: FC_SERVICE_ROLE
        value: "job"
      - key: FC_JOB_REQUIRES_STRIPE
        value: "false"
      # Error reporting — the same Sentry project and the same DSN
      # value as fc-api. The ``component`` tag, set by the script from
      # its own Render service name, is what separates this job's
      # issues from the API's. Dashboard-owned; absent is a clean
      # no-op. See the fc-api block for the full reasoning.
      - key: SENTRY_DSN
        sync: false

