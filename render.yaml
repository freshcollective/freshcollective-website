# render.yaml — Fresh Collective four-resource Blueprint.
#
# Scope
# -----
# Declares the full production topology on Render:
#   1. fc-web  — Next.js frontend (public web service)
#   2. fc-api  — FastAPI backend (public web service)
#   3. fc-fip3-grace-reconciler — FIP3 grace-expiry cron
#   4. fc-db   — managed Postgres
#
# All regional resources are pinned to Singapore. The runtime keys use
# the current `runtime:` field (Render deprecated `env:` in favour of
# `runtime:` — see https://render.com/docs/blueprint-spec).
#
# Why the cron exists alongside the in-process reconciler
# -------------------------------------------------------
# ``backend/app/services/finite_plan_reconciler.py`` runs a
# 5-minute in-process sweep from FastAPI's lifespan. That's belt.
# This cron is braces: an independent scheduler that keeps grace-expiry
# transitions honest when the web dyno restarts, deploys, or sleeps.
# Both triggers are idempotent (row-locked + status re-check under
# lock in ``sweep_expired_grace_plans``); running the same expired
# plan twice is safe.
#
# See docs/finite-payment-plans-stripe-config.md for the operator
# requirements this Blueprint satisfies.
#
# Uploads storage — Cloudflare R2
# -------------------------------
# fc-api writes uploads to Cloudflare R2 when the R2_* env vars are
# set (see the fc-api block below). Two buckets: private for member/
# creator content served via short-lived presigned URLs, public for
# platform artwork on marketing pages. When R2 credentials are absent
# the storage module falls back to ``backend/uploads/`` on the local
# filesystem — used only by local dev and tests, since that path is
# EPHEMERAL on Render (wiped on every deploy / restart / instance
# move). Any production deploy MUST have the R2 env vars set.
#
# Migration policy
# ----------------
# fc-api declares ``preDeployCommand: alembic upgrade head`` (see the
# fc-api service block below). Render runs it against the newly-built
# release image BEFORE cutting any traffic over, so the schema is
# always in place before code that requires it starts serving.
#
# What this policy covers:
#   * Normal, additive, backwards-compatible migrations (add nullable
#     column; add table; add index CONCURRENTLY; add enum value;
#     backfill that completes in seconds). These run automatically
#     on every deploy — no operator action required.
#
# What this policy does NOT cover — must ship as an explicit,
# staged multi-deploy plan documented in the migration file itself:
#   * Dropping or renaming a column, table, enum value, or constraint.
#   * NOT NULL / CHECK additions that require a data backfill first.
#   * Any migration whose upgrade() step is not safe to run against
#     the currently-live application code (e.g. removing a column the
#     old code still SELECTs).
#   * Long-running data migrations that hold locks or block writes
#     beyond a few seconds.
#   * Anything that cannot be rolled back cleanly without data loss.
#
# ``alembic upgrade head`` alone does NOT make an unsafe migration
# safe — the author of the migration is responsible for staging the
# rollout (e.g. add-column-nullable → deploy → backfill → deploy →
# add-NOT-NULL). If in doubt, the migration should note the staging
# plan at the top and reviewers should confirm the plan before merge.

databases:
  # ─────────────────────────────────────────────────────────────────
  # Managed Postgres — fc-db
  # ─────────────────────────────────────────────────────────────────
  # Plan slug uses Render's current compute-notation format
  # (Nc-Ng); ``0.5c-1g`` is the canonical Blueprint ID for the
  # 0.5 CPU / 1 GB Postgres tier (equivalent to the legacy alias
  # ``basic-1gb``) — smallest paid plan, ~100 max connections.
  # Adequate for smoke + early access; resize via Render Dashboard
  # when needed.
  # ipAllowList: [] means "no public IPs allowed" — Postgres is
  # only reachable from services inside the same Render region via
  # the internal connection string.
  #
  # Migrations
  # ----------
  # Applied automatically by fc-api's ``preDeployCommand`` on every
  # release (see the top-of-file "Migration policy" block for the
  # additive-only scope and the staged-rollout requirement for
  # destructive changes).
  # Backend boots on empty DB: /health has no DB dependency;
  # lifespan background tasks (reconciler + publisher) use
  # asyncio.create_task so exceptions log non-fatally; alembic is
  # installed via requirements.txt (``alembic>=1.14.0``).
  # fc-db remains externally closed (ipAllowList: []); no
  # operator-IP allowlisting required.
  - name: fc-db
    plan: 0.5c-1g
    region: singapore
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  # ─────────────────────────────────────────────────────────────────
  # Frontend web service — fc-web (Next.js)
  # ─────────────────────────────────────────────────────────────────
  # Next.js production build; ``npm start`` serves the built app on
  # Render's injected $PORT. Node pin is via the NODE_VERSION env
  # var (Render's Blueprint-native mechanism — no .nvmrc needed).
  #
  # Backend URL wiring (SEC-002, SEC-010 Step 1)
  # --------------------------------------------
  # ``API_INTERNAL_URL`` is the server-side target for the Next.js proxy
  # handler at ``src/app/api/[...path]/route.ts`` and for the server
  # helpers in ``src/lib/serverApi.ts``. It is NEVER exposed to the
  # browser: application API calls originate same-origin against
  # ``fc-web`` and are forwarded server-side to this URL.
  #
  # SEC-010 Step 1 — pulled via ``fromService.property: hostport``, which
  # returns fc-api's Render *private* ``<hostname>:<port>`` reachable
  # only from services in this same Render account/region. Traffic
  # therefore never traverses Cloudflare or the public load balancer,
  # so the browser IP loss observed at the public hop (SEC-010
  # investigation) is architecturally avoided. ``resolveInternalApiBase``
  # in ``frontend/src/lib/api.ts`` prepends ``http://`` when the value
  # is a bare host:port (Render private) and leaves full URLs alone
  # (local dev). No scheme change required to the env var itself.
  #
  # ``NEXT_PUBLIC_API_URL`` is separately baked into the client bundle
  # for media URLs only (``<img src>`` against ``/api/uploads/…``). It
  # still points at the *public* HTTPS host because browsers cannot
  # reach the private one. Keeping the two variables distinct preserves
  # the least-privilege split between "browser knows the media host"
  # and "server knows the API host".
  #
  # NOTE: no ``AUTH_SECRET`` is declared here. fc-web deliberately does
  # not receive the JWT signing key — the backend is the sole
  # authority for session verification via ``/api/auth/me``.
  - type: web
    name: fc-web
    runtime: node
    region: singapore
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.15.0"
      - key: NEXT_PUBLIC_DISCOVERY_PILLAR_ENABLED
        value: "false"
      # Server-side proxy target — not exposed to the browser.
      # SEC-010 Step 1: routes BFF traffic over Render's private
      # per-account network. ``hostport`` yields ``<host>:<port>``;
      # ``resolveInternalApiBase`` in the frontend prepends ``http://``.
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: fc-api
          property: hostport
      # Media / <img src> only — public host baked into the client bundle.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: fc-api
          envVarKey: RENDER_EXTERNAL_URL
      # SEC-010 Step 2 — shared credential authenticating the BFF's
      # ``X-Fc-Client-IP`` claim to fc-api. Must be the SAME value on
      # both fc-web and fc-api. ``sync: false`` = Render prompts on
      # first sync and never commits the value back to git. Enter via
      # each service's Environment page. Rotation = paste new value on
      # both services; a ~90-second restart window briefly degrades
      # limiter accuracy but no security regression.
      - key: INTERNAL_BFF_SECRET
        sync: false

  # ─────────────────────────────────────────────────────────────────
  # Backend web service — fc-api (FastAPI)
  # ─────────────────────────────────────────────────────────────────
  # Backend uses pip + requirements.txt (no pyproject.toml, no uv,
  # no Poetry). Render's default Python buildpack runs pip install
  # against requirements.txt at buildCommand and puts uvicorn on
  # $PATH, so no ``.venv/bin/*`` prefix is used or needed.
  #
  # rootDir: backend so every command is backend-relative and doesn't
  # trip over the legacy Next.js scaffold that still lives at repo
  # root (the active frontend is at frontend/, not /).
  - type: web
    name: fc-api
    runtime: python
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Alembic runs against the freshly-built release image before
    # Render cuts any traffic over, so the schema is always in place
    # before the new code starts serving. On non-zero exit the deploy
    # aborts and existing traffic continues to hit the previous
    # image. See the top-of-file "Migration policy" block for the
    # additive-only scope and the staged-rollout requirement for
    # destructive changes.
    preDeployCommand: alembic upgrade head
    # Render injects $PORT; bind 0.0.0.0 for public traffic.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Committed, safe defaults ------------------------------------
      - key: APP_ENV
        value: production
      # Public member finite-plan checkout stays HARD-OFF by default.
      # Flip to "true" in the Render Dashboard only after the
      # hosted smoke sequence in
      # docs/finite-payment-plans-stripe-config.md §6 passes.
      - key: FINITE_PLAN_MEMBER_CHECKOUT_ENABLED
        value: "false"
      - key: DISCOVERY_PILLAR_ENABLED
        value: "false"
      - key: COMMUNITY_CARE_ENABLED
        value: "false"

      # Managed Postgres wire-up ------------------------------------
      # Uses Render's fromDatabase cross-reference so the connection
      # string is injected automatically on every deploy — no manual
      # dashboard edit, and the value rotates cleanly if the DB is
      # recreated.
      - key: DATABASE_URL
        fromDatabase:
          name: fc-db
          property: connectionString

      # Secrets / environment-specific — set in Render Dashboard ----
      # sync: false makes Render prompt on first Blueprint sync and
      # NEVER commits the value back to the file.
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      # STRIPE_WEBHOOK_SECRET
      # ---------------------
      # Set AFTER fc-api has a public HTTPS URL and a Render-hosted
      # Stripe test webhook is created pointing at
      # {fc-api-url}/api/webhooks/stripe. Do NOT reuse the local
      # Stripe CLI whsec — that secret only signs events that the
      # local CLI forwards.
      #
      # Missing value is safe at boot: settings.stripe_webhook_secret
      # defaults to None (see backend/app/core/config.py), the app
      # starts cleanly, and the /api/webhooks/stripe endpoint
      # rejects unsigned/unverifiable requests with HTTP 400 via
      # stripe.Webhook.construct_event (SignatureVerificationError).
      #
      # RESEND_WEBHOOK_SECRET intentionally omitted at launch. Add
      # after fc-api HTTPS URL exists and the Resend webhook is
      # configured at {fc-api-url}/api/webhooks/comms/resend
      # (R4 already handles missing-secret cleanly: startup warning,
      # non-fatal, endpoint rejects with 401).
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PLATFORM_OWNER_EMAIL
        sync: false
      - key: STRIPE_PRICE_ID_CREATOR
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      # SEC-010 Step 2 — must match fc-web's INTERNAL_BFF_SECRET exactly.
      # See the comment on fc-web's declaration for rotation guidance.
      - key: INTERNAL_BFF_SECRET
        sync: false
      # SEC-007 — dedicated credential for the four ``/api/internal/*``
      # endpoints (dispatch-due, reconcile-shadow, dev-test-send,
      # send-event-reminders). Independent of ``JWT_SECRET`` so
      # possession of this token cannot mint user session JWTs, and
      # independent of ``INTERNAL_BFF_SECRET`` so the two internal
      # trust domains rotate separately. Compared with
      # ``secrets.compare_digest`` via
      # ``app.core.internal_auth.verify_internal_token``. Missing
      # value = every internal endpoint fails closed with 401.
      #
      # Not declared on ``fc-web`` (no code path there consumes
      # internal endpoints) or on the ``fc-fip3-grace-reconciler``
      # cron (it makes no HTTP calls to fc-api). Add to any future
      # service that legitimately needs to call ``/api/internal/*``.
      - key: INTERNAL_COMMS_SECRET
        sync: false
      # Auto-wired from fc-web's RENDER_EXTERNAL_URL via Render's
      # Blueprint fromService.envVarKey mechanism — the full
      # public HTTPS URL is injected at deploy time, so no
      # dashboard placeholder step is needed. Used for CORS and
      # as the fallback for PUBLIC_APP_URL (which is intentionally
      # not declared here — the code falls back to FRONTEND_ORIGIN
      # when PUBLIC_APP_URL is unset).
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: fc-web
          envVarKey: RENDER_EXTERNAL_URL

      # Persistent Media Storage — Cloudflare R2.
      # ----------------------------------------------------------------
      # Two buckets: ``fc-media`` (private, presigned reads) and
      # ``fc-media-public`` (public via R2.dev URL for now, custom
      # domain later). Split matches the ``/api/uploads/*`` router:
      # ``platform-artwork/*`` keys go to the public bucket, everything
      # else to the private one. See ``app/core/storage.py`` +
      # ``app/uploads/routes.py``.
      #
      # Production requires all six vars — the ``_check_r2_configuration``
      # validator in ``core/config.py`` refuses to boot fc-api when
      # ``APP_ENV=production`` and any R2 var is missing. On Render
      # that aborts the deploy and the previous image keeps serving,
      # so uploads never land on the container's ephemeral disk in
      # production. A partial R2 config (some vars set, others not)
      # also refuses to boot in any environment.
      #
      # ``sync: false`` on the three credentials + the public URL
      # (which changes when Lindsey attaches a custom domain later).
      # Bucket names are safe in git and set as literal values so a
      # blueprint re-apply does not require re-entering them.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_PRIVATE
        value: fc-media
      - key: R2_BUCKET_PUBLIC
        value: fc-media-public
      - key: R2_PUBLIC_BASE_URL
        sync: false

  # ─────────────────────────────────────────────────────────────────
  # FIP3 grace-expiry reconciler — independent cron
  # ─────────────────────────────────────────────────────────────────
  # Runs every 15 minutes. Cadence is a reliability decision, not a
  # timing one — the sweep uses ``grace_expires_at <= now`` so a
  # 3-hour-late run still catches everything correctly. The cron is
  # a safety net for the in-process reconciler, not its replacement.
  #
  # The script is standalone-safe as of the registry-priming import
  # added on 2026-08-19 (see the script's header comment).
  #
  # Does NOT need Stripe / Resend credentials — the sweep is DB-only.
  # But it imports app.main to load the full SQLAlchemy model
  # registry, which pulls in ``settings = Settings()`` at module
  # load; that requires DATABASE_URL and JWT_SECRET to be present
  # (both have no dataclass defaults in ``app.core.config.Settings``).
  # Every other setting has a safe default.
  - type: cron
    name: fc-fip3-grace-reconciler
    runtime: python
    region: singapore
    branch: main
    rootDir: backend
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/fip3_reconcile_grace.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fc-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
