      # EVERY python service, not only the ones that send email: each of
      # them constructs the shared ``Settings`` object, and
      # ``_check_public_app_url`` is a global production invariant on it.
      # See the fc-api block for why this is not FRONTEND_ORIGIN.
      - key: PUBLIC_APP_URL
        value: https://freshcollective.au
      - key: DATABASE_URL
        fromDatabase:
          name: fc-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      # Error reporting — the same Sentry project and the same DSN
      # value as fc-api. The ``component`` tag, set by the script from
      # its own Render service name, is what separates this job's
      # issues from the API's. Dashboard-owned; absent is a clean
      # no-op. See the fc-api block for the full reasoning.
      - key: SENTRY_DSN
        sync: false
